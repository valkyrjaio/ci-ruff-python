[project]
name = "valkyrja-ci-ruff-pytest"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "coverage>=7.15.3,<8"]

[tool.uv]
# Environment-only project: install the tools, never build this directory.
package = false

# Paths are relative to this config file's directory (the pytest rootdir when
# invoked with `-c`), hence the `../../../` back to the repo root. Coverage
# resolves from the working directory instead, so `source` below is
# repo-root-relative.
[tool.pytest.ini_options]
testpaths = ["../../../tests"]
pythonpath = ["../../../src"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib --strict-markers"

[tool.coverage.run]
branch = true
# Coverage cannot walk a PEP 420 namespace package: an untested module vanishes
# from the report and the total still reads 100%. Name the source by path.
source = ["src/valkyrja/ruff"]

[tool.coverage.report]
# Coverage skips a directory with no `__init__.py`, hiding an untested component
# behind a 100% total. This option makes coverage walk it.
include_namespace_packages = true
show_missing = true
fail_under = 100
