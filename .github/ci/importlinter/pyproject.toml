[project]
name = "valkyrja-ci-ruff-importlinter"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["import-linter>=2.15,<3"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

# import-linter enforces module boundaries. The root poe task sets PYTHONPATH=src
# so `valkyrja.ruff` is importable.
[tool.importlinter]
root_packages = ["valkyrja.ruff"]

# The command uses the factories, and a factory uses the constants and the exceptions.
[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
containers = ["valkyrja.ruff"]
layers = [
    "cli",
    "factory",
    "constant : exception",
]
