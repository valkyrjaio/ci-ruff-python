name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_python-create-release.yml@27ee4b60e875624589cd2b2cd3633e4389f337ce
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Ruff",           "directory": ".github/ci/ruff"},
          {"name": "mypy",           "directory": ".github/ci/mypy"},
          {"name": "Bandit",         "directory": ".github/ci/bandit"},
          {"name": "import-linter",  "directory": ".github/ci/importlinter"},
          {"name": "pytest",         "directory": ".github/ci/pytest"}
        ]
      info-file-path: src/valkyrja/ruff/constant/ruff_info.py
      info-file-name: RuffInfo

  publish:
    needs: release
    # A release that finds no pending commit skips the jobs that write a version, and this
    # job would then offer the registry a version it holds already, which fails the run.
    if: needs.release.outputs.should-release == 'true'
    uses: valkyrjaio/.github/.github/workflows/_python-release-pypi-publish.yml@27ee4b60e875624589cd2b2cd3633e4389f337ce
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
